<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="glassPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.3)" />
      <stop offset="100%" stop-color="rgba(2, 132, 199, 0.3)" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Futuristic Viewport Background -->
  <rect x="10" y="10" width="520" height="300" rx="24" fill="url(#bgGlow)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="10" y1="85" x2="530" y2="85" />
    <line x1="10" y1="160" x2="530" y2="160" />
    <line x1="10" y1="235" x2="530" y2="235" />
    <line x1="140" y1="10" x2="140" y2="310" />
    <line x1="270" y1="10" x2="270" y2="310" />
    <line x1="400" y1="10" x2="400" y2="310" />
  </g>

  <!-- Holographic Bottle 1 (PET Plastic) -->
  <g transform="translate(110, 55)">
    <!-- Bounding Box -->
    <rect x="-15" y="-15" width="130" height="210" rx="14" fill="rgba(16, 185, 129, 0.08)" stroke="#10b981" stroke-width="2" stroke-dasharray="6 3"/>
    
    <!-- Tag -->
    <rect x="-15" y="-35" width="105" height="22" rx="6" fill="#10b981"/>
    <text x="-6" y="-20" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">BOT-PET · 96.8%</text>

    <!-- Bottle Drawing -->
    <path d="M40 10 H60 V22 C68 26 76 34 76 48 V150 C76 162 68 170 56 170 H44 C32 170 24 162 24 150 V48 C24 34 32 26 40 22 Z" 
          fill="rgba(56, 189, 248, 0.25)" stroke="#38bdf8" stroke-width="2"/>
    <path d="M38 6 H62 V12 H38 Z" fill="#10b981"/>
    
    <!-- Recycling Waves in bottle -->
    <path d="M32 90 Q50 80 68 90" stroke="#34d399" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M32 110 Q50 100 68 110" stroke="#34d399" stroke-width="2" fill="none" opacity="0.8"/>
  </g>

  <!-- Holographic Bottle 2 (Glass Bottle) -->
  <g transform="translate(320, 75)">
    <!-- Bounding Box -->
    <rect x="-15" y="-15" width="115" height="190" rx="14" fill="rgba(2, 132, 199, 0.08)" stroke="#0284c7" stroke-width="2"/>
    
    <!-- Tag -->
    <rect x="-15" y="-35" width="95" height="22" rx="6" fill="#0284c7"/>
    <text x="-6" y="-20" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">VIDRIO · 92.4%</text>

    <!-- Bottle Drawing -->
    <path d="M34 10 H50 V26 C56 30 62 38 62 52 V132 C62 142 56 150 46 150 H38 C28 150 22 142 22 132 V52 C22 38 28 30 34 26 Z" 
          fill="rgba(16, 185, 129, 0.25)" stroke="#10b981" stroke-width="2"/>
    <path d="M32 6 H52 V12 H32 Z" fill="#0284c7"/>
  </g>

  <!-- Laser Scan Beam -->
  <line x1="30" y1="140" x2="510" y2="140" stroke="#34d399" stroke-width="3" filter="url(#neon)"/>
  <circle cx="270" cy="140" r="5" fill="#ffffff" filter="url(#neon)"/>

  <!-- AI Inference Chip Floating -->
  <g transform="translate(30, 260)">
    <rect width="210" height="32" rx="10" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.15)"/>
    <circle cx="20" cy="16" r="4" fill="#10b981"/>
    <text x="34" y="21" fill="#e2e8f0" font-family="'Space Grotesk', monospace" font-size="11" font-weight="700">MobileNet v2 · 60 FPS WebGL</text>
  </g>
</svg>
